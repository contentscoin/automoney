name: desktop-build

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @automoney/shared build
      - run: pnpm --filter @automoney/desktop build
      - run: pnpm --filter @automoney/desktop test
      # 서명 시크릿이 있으면 서명·(mac) 노터라이즈, 없으면 서명 없이 빌드
      - name: Package
        working-directory: apps/desktop
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AUTOMONEY_UPDATE_FEED_URL: ${{ vars.AUTOMONEY_UPDATE_FEED_URL || 'https://example.invalid/updates' }}
      - uses: actions/upload-artifact@v4
        with:
          name: automoney-desktop-${{ matrix.target }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: warn
